<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="ledon — .NET, AI tooling, streaming media and IoT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0f2747"/>
      <stop offset="1" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="1030" cy="40" r="220" fill="url(#glow-blue)"/>
  <circle cx="1160" cy="250" r="180" fill="url(#glow-purple)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#f0f6fc" font-size="72" font-weight="700" letter-spacing="-2">ledon</text>
    <rect x="82" y="128" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="82" y="160" fill="#8b949e" font-size="20" letter-spacing="1">@wosledon</text>
    <text x="82" y="208" fill="#c9d1d9" font-size="24" font-weight="600">.NET · AI Tooling · Streaming Media · IoT</text>
    <text x="82" y="242" fill="#8b949e" font-size="16">Build small, useful things. / 把想法做成好用的工具。</text>
  </g>

  <g transform="translate(880 78)" font-family="Consolas, SFMono-Regular, Menlo, monospace">
    <rect width="240" height="128" rx="14" fill="#0d1117" fill-opacity="0.55" stroke="#30363d"/>
    <circle cx="20" cy="20" r="5" fill="#ff7b72"/>
    <circle cx="38" cy="20" r="5" fill="#d29922"/>
    <circle cx="56" cy="20" r="5" fill="#3fb950"/>
    <text x="20" y="58" fill="#7ee787" font-size="14">$ dotnet build</text>
    <text x="20" y="84" fill="#79c0ff" font-size="14">$ npm run dev</text>
    <text x="20" y="110" fill="#8b949e" font-size="14">→ ship something useful</text>
  </g>
</svg>
